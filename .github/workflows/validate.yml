name: PR validation
on:
  pull_request:

permissions:
  contents: read

# a new push to a PR supersedes the runs for its earlier commits
concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      # a failure in one part must not hide the results of the other
      fail-fast: false
      matrix:
        # see the definitions in build.sbt: testAll2 is partest, testAll1 is everything else
        tests: [testAll1, testAll2]
    name: validate (${{ matrix.tests }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 8
          cache: sbt
      - uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1.5.12
      # "mini" bootstrap for PR validation
      # "mini" in these senses:
      # - it doesn't use the complicated legacy scripts.
      # - it doesn't publish to scala-pr-validation-snapshots
      #   (because we need secrets for that and PRs from forks can't have secrets)
      # it is still a true bootstrap.
      - name: build
        run: sbt -warn setupPublishCore generateBuildCharacterPropertiesFile headerCheck publishLocal
      - name: ${{ matrix.tests }}
        run: |
          STARR=$(sed -n 's/^maven\.version\.number=//p' buildcharacter.properties) && echo $STARR
          sbt -Dstarr.version=$STARR setupValidateTest ${{ matrix.tests }}
